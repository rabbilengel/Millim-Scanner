# Runs the automated tests on GitHub every time changes are pushed.
# A green check mark next to a commit means all tests passed.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pdftoppm (used to check printed sheets)
        run: which pdftoppm || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Run tests
        run: npm test
